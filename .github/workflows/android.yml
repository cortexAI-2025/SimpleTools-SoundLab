name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$manager"
          echo "${manager%/*}" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify signed APK and permissions
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SimpleTools-SoundLab-1.0.0-debug.apk
          apk=dist/SimpleTools-SoundLab-1.0.0-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | grep "package: name='com.simpletools.soundlab' versionCode='1' versionName='1.0.0'"
          "$tools/aapt" dump permissions "$apk" > /tmp/soundlab-permissions
          grep -F android.permission.RECORD_AUDIO /tmp/soundlab-permissions
          if grep -E 'android.permission.(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_FINE_LOCATION)' /tmp/soundlab-permissions; then exit 1; fi
          (cd dist; sha256sum *.apk | tee SHA256SUMS; wc -c *.apk)
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleTools-SoundLab-Android-APK
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoundLab-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/schemas/
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$manager"
          echo "${manager%/*}" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk" 'platforms;android-35'
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoundLab-Android-test-reports
          path: app/build/reports/androidTests/
